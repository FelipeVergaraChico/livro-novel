services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: livronovel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livronovel_local}
      POSTGRES_DB: livronovel
    ports:
      - '127.0.0.1:54338:5432'
    volumes:
      - livronovel_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U livronovel']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  livronovel_db:
